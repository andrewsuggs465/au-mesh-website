# ─────────────────────────────────────────────────────────────────
# AU Mesh Club events
#
# This one file drives the Events page and the "Next up" card on the
# homepage. To add or change an event, edit this file (the GitHub web
# editor works fine) and push — the site rebuilds automatically.
#
# Fields:
#   title:      event name (required)
#   date:       YYYY-MM-DD (required unless the date isn't set yet)
#   dateText:   free-text date shown when `date` is missing, e.g. "January 2027 — date TBD"
#   time:       free text, e.g. "6:00 PM" (optional)
#   location:   free text (optional)
#   type:       meeting | workshop | social | special (optional)
#   tentative:  true to show a "tentative" badge (optional)
#   details:    a sentence or two shown on the card (optional)
#   link:       URL for more info (optional)
#
# Events with a past date automatically move to the "Past events"
# section on the next rebuild. The site also rebuilds itself weekly.
# ─────────────────────────────────────────────────────────────────

