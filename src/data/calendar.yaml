# ─────────────────────────────────────────────────────────────────
# AU Mesh Club calendar
#
# Every meeting, workshop, and event in one list. This file drives
# the Calendar page, the "Next up" card on the homepage, and the
# subscribable feed at aumesh.club/aumesh.ics.
#
# To add or change something, edit this file (the GitHub web editor
# works fine) and push. The site rebuilds automatically.
#
# Fields:
#   title:      name (required)
#   date:       YYYY-MM-DD (required unless the date isn't set yet)
#   dateText:   free-text date shown when `date` is missing, e.g. "January 2027, date TBD"
#   time:       free text, e.g. "4:00 PM - 5:00 PM" or "6:00 PM" (optional)
#   location:   free text (optional)
#   type:       meeting | workshop | social | special (defaults to meeting)
#   tentative:  true to show a "tentative" badge (optional)
#   details:    a sentence or two shown on the card (optional)
#   link:       URL for more info, usually AUinvolve (optional)
#
# `type` is what the filter buttons on the Calendar page switch on,
# so set it on every entry. Entries with a past date move to "Past
# events" on their own, and undated ones sort to the end. Keep the
# list in date order to make it easy to read.
#
# The times are read as US Central, and the .ics feed handles
# daylight saving for you.
# ─────────────────────────────────────────────────────────────────

